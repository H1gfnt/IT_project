<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@700&family=Roboto:ital,wght@1,700&display=swap" rel="stylesheet">
    <title>EchoFlow</title>
</head>
<body>
    <div class="intro">
        <header class="header">
            <div class="container">
                <div class="header_inner">
                    <div class="logo_wrapper">
                        <div class="header_logo"></div>
                        <span class="logo_text">EchoFlow</span>
                    </div>

                    <nav class="nav">
                        <a class="nav_link" href="#">Вход</a>
                    </nav>
                </div>
            </div>
        </header>

        <header>
            <div class="login_box">
                <h1 class="login_h1">Вход</h1>
                <form class="form_login">
                    <form id="loginForm" action="/auth/login/" method="POST">
                        <div class="form-group">
                            <label for="email">Почта</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <button type="submit">Войти</button>
                        <div id="errorMessage" class="error"></div>
                        <div class="register-link">
                            Нет аккаунта? <a class="reg_href" href="/auth/register/">Зарегистрироваться</a>
                        </div>
                    </form>
                </form>
            </div>
        </header>
    </div>

</body>
