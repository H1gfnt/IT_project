{% extends 'index.html' %}

{% block content %}
    <div class="login_box">
        <h1 class="login_h1">Вход</h1>
        <form id="loginForm" action="/api/v1/auth/login/" method="POST">
            <div class="form-group">
                <label for="email">Почта</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Войти</button>
            <div id="errorMessage" class="error"></div>
            <div class="register-link">
                Нет аккаунта? <a href="{{ url_for('register_page') }}">Зарегистрироваться</a>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                if (response.ok) {
                    window.location.href = '/api/v1/users/profile/';
                } else {
                    const data = await response.json();
                    document.getElementById('errorMessage').textContent = data.detail || 'Login failed';
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = 'An error occurred during login';
            }
        });
    </script>
{% endblock %}
