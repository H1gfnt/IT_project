{% extends 'index.html' %}

{% block content %}
    <div class="register_box">
        <h1 class="register_h1">Регистрация</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль (от 5 до 50 символов)</label>
                <input type="password" id="password" name="password" required minlength="5" maxlength="50">
            </div>
            <div class="form-group">
                <label for="phone_number">Номер телефона (+79991234567)</label>
                <input type="tel" id="phone_number" name="phone_number" pattern="\+\d{5,15}" required>
            </div>
            <div class="form-group">
                <label for="first_name">Имя (от 3 до 50 символов)</label>
                <input type="text" id="first_name" name="first_name" required minlength="3" maxlength="50">
            </div>
            <div class="form-group">
                <label for="last_name">Фамилия (от 3 до 50 символов)</label>
                <input type="text" id="last_name" name="last_name" required minlength="3" maxlength="50">
            </div>
            <label>Выбери любимые жанры</label>
                <div class="options-list">
                    <label class="option-item">
                    <input type="checkbox" class="real-checkbox">
                    <span class="custom-checkbox"></span>
                    <span class="option-text">Поп</span>
                    </label>
                    
                    <label class="option-item">
                    <input type="checkbox" class="real-checkbox">
                    <span class="custom-checkbox"></span>
                    <span class="option-text">Хип-хоп</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Рэп</span>
                    </label>
                    
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Рок</span>
                    </label>
                    
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">R&B</span>
                    </label>
                    
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Кантри</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Метал</span>
                    </label>
                        
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Инди</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">К-поп</span>
                    </label>
                    
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Регги</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Джаз</span>
                    </label>
                        
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Блюз</span>
                    </label>
                    
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Trap</span>
                    </label>
                        
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Drill</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Lo-Fi</span>
                    </label>
                        
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Funk</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Rave</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Класическая</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Латинская</span>
                    </label>
                        
                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Электронная</span>
                    </label>

                    <label class="option-item">
                        <input type="checkbox" class="real-checkbox">
                        <span class="custom-checkbox"></span>
                        <span class="option-text">Хип-хаус</span>
                    </label>
                </div>
            <button type="submit">Зарегистрироваться</button>
            <div id="errorMessage" class="error"></div>
            <div id="successMessage" class="success"></div>
        </form>
        <div class="login-link">
            Уже есть аккаунт? <a href="{{ url_for('login_page') }}">Войти</a>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Получаем данные формы
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone_number: document.getElementById('phone_number').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value
            };

            // Очищаем сообщения
            document.getElementById('errorMessage').textContent = '';
            document.getElementById('successMessage').textContent = '';

            try {
                const response = await fetch('/api/v1/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    document.getElementById('successMessage').textContent = 'Регистрация прошла успешно! Перенаправляем на страницу входа...';

                    // Редирект через 1 секунду
                    setTimeout(() => {
                        window.location.href = '/api/v1/auth/login/?message=registration_success';
                    }, 1000);
                } else {
                    const data = await response.json();
                    let errorMessage = 'Ошибка при регистрации';

                    if (data.detail === 'Пользователь уже существует') {
                        errorMessage = 'Пользователь с таким email уже зарегистрирован';
                    } else if (data.detail) {
                        errorMessage = data.detail;
                    }

                    document.getElementById('errorMessage').textContent = errorMessage;
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = 'Ошибка соединения с сервером';
            }
        });

        // Валидация номера телефона в реальном времени
        document.getElementById('phone_number').addEventListener('input', function (e) {
            if (!this.value.startsWith('+')) {
                this.setCustomValidity('Номер должен начинаться с +');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
{% endblock %}
